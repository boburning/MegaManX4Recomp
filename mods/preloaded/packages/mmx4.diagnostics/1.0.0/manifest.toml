format_version = 5
id = "mmx4.diagnostics"
version = "1.0.0"
name = "Playtest Diagnostics"
author = "mstan"
description = "Optional input display and diagnostic recording with initial memory cards. Off by default."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00561"
disc_sha256 = "3ceab06ac99add4035f912188bcbf5b16c02056f46a33d38ff0c8dbce6cb613b"

[[feature]]
id = "inputs"
name = "Input Display and Recording"
